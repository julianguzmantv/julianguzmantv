<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0a2a1a"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="100" x2="900" y2="100" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="150" x2="900" y2="150" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="200" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="750" y1="0" x2="750" y2="200" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Glowing accent bar top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#neon)" filter="url(#glow2)"/>

  <!-- Bracket left -->
  <text x="32" y="120" font-family="monospace" font-size="80" fill="#00ff9d" filter="url(#glow)" opacity="0.3">{</text>

  <!-- Name -->
  <text x="450" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">Julian Guzmán</text>

  <!-- Neon underline -->
  <rect x="180" y="98" width="540" height="2" fill="url(#neon)" filter="url(#glow)" rx="1"/>

  <!-- Subtitle -->
  <text x="450" y="130" font-family="monospace" font-size="15" fill="#00ff9d" text-anchor="middle" filter="url(#glow)" letter-spacing="1">Backend Developer · Java &amp; Spring Boot · Microservices</text>

  <!-- Tags -->
  <rect x="230" y="148" width="120" height="22" rx="11" fill="#00ff9d" fill-opacity="0.12" stroke="#00ff9d" stroke-width="1"/>
  <text x="290" y="163" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">🇨🇴 Colombia</text>

  <rect x="365" y="148" width="170" height="22" rx="11" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="1"/>
  <text x="450" y="163" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">🎓 Univ. de los Llanos</text>

  <rect x="550" y="148" width="120" height="22" rx="11" fill="#ff6ec7" fill-opacity="0.12" stroke="#ff6ec7" stroke-width="1"/>
  <text x="610" y="163" font-family="monospace" font-size="11" fill="#ff6ec7" text-anchor="middle">🌐 EN / ES</text>

  <!-- Bracket right -->
  <text x="848" y="120" font-family="monospace" font-size="80" fill="#00d4ff" filter="url(#glow)" opacity="0.3">}</text>

  <!-- Glowing accent bar bottom -->
  <rect x="0" y="197" width="900" height="3" fill="url(#neon)" filter="url(#glow2)" rx="0"/>
</svg>
